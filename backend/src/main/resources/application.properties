spring.application.name=contextlayer

# Load backend/.env if present (the working directory is backend/ when you run from IntelliJ or mvn)
spring.config.import=optional:file:.env[.properties]

# Database: env vars override defaults. DB_PASSWORD has NO default, so startup fails loudly if it's missing.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/contextlayer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

server.port=8080

management.endpoints.web.exposure.include=health,info

logging.level.com.contextlayer=DEBUG

# --- Indexing ---
contextlayer.indexing.max-file-size-bytes=1048576
contextlayer.indexing.ignored-directories=.git,node_modules,target,build,dist,out,.idea,.vscode,.gradle,.mvn,__pycache__,.venv,venv,coverage,.next
contextlayer.indexing.ignored-extensions=png,jpg,jpeg,gif,webp,ico,svg,pdf,zip,jar,class,exe,dll,so,woff,woff2,ttf,mp3,mp4,lock,log
contextlayer.indexing.ignored-file-names=package-lock.json,pnpm-lock.yaml,yarn.lock,mvnw,mvnw.cmd,.DS_Store,Thumbs.db
contextlayer.indexing.chunk-max-lines=80
contextlayer.indexing.chunk-overlap-lines=10
contextlayer.indexing.chunk-max-chars=6000

# --- Git intelligence ---
contextlayer.git.max-commits=2000
contextlayer.git.max-files-per-commit-for-cochange=30
contextlayer.git.min-co-change-count=2
contextlayer.git.timeout-seconds=60

# --- Embeddings ---
# provider: "hash" (offline, zero setup, lexical) or "ollama" (real semantic model, local)
#contextlayer.embedding.provider=hash
#contextlayer.embedding.dimensions=384
contextlayer.embedding.batch-size=32
contextlayer.embedding.max-input-chars=4000
#contextlayer.embedding.query-prefix=
#contextlayer.embedding.document-prefix=
contextlayer.embedding.ollama-url=http://localhost:11434
contextlayer.embedding.ollama-model=nomic-embed-text
contextlayer.embedding.timeout-seconds=60
#
contextlayer.embedding.provider=ollama
contextlayer.embedding.dimensions=768
contextlayer.embedding.query-prefix=search_query:
contextlayer.embedding.document-prefix=search_document:

# --- Hybrid search ---
contextlayer.search.rrf-k=60
contextlayer.search.candidates-per-signal=40
contextlayer.search.keyword-weight=1.0
contextlayer.search.semantic-weight=1.0
contextlayer.search.summary-weight=0.6
contextlayer.search.name-weight=0.8