spring.application.name=contextlayer

# Load backend/.env if present (the working directory is backend/ when you run from IntelliJ or mvn)
spring.config.import=optional:file:.env[.properties]

# Database: env vars override defaults. DB_PASSWORD has NO default, so startup fails loudly if it's missing.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/contextlayer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

#server.port=8080

management.endpoints.web.exposure.include=health,info

logging.level.com.contextlayer=DEBUG

# --- Indexing ---
contextlayer.indexing.max-file-size-bytes=1048576
contextlayer.indexing.ignored-directories=.git,node_modules,target,build,dist,out,.idea,.vscode,.gradle,.mvn,__pycache__,.venv,venv,coverage,.next
contextlayer.indexing.ignored-extensions=png,jpg,jpeg,gif,webp,ico,svg,pdf,zip,jar,class,exe,dll,so,woff,woff2,ttf,mp3,mp4,lock,log,pem,key,p12,pfx,jks,keystore
contextlayer.indexing.ignored-file-names=package-lock.json,pnpm-lock.yaml,yarn.lock,mvnw,mvnw.cmd,.DS_Store,Thumbs.db,.env,.env.local,.env.production,id_rsa,id_ed25519,.npmrc,.pypirc,credentials,secrets.json
contextlayer.indexing.chunk-max-lines=80
contextlayer.indexing.chunk-overlap-lines=10
contextlayer.indexing.chunk-max-chars=6000

# --- Git intelligence ---
contextlayer.git.max-commits=2000
contextlayer.git.max-files-per-commit-for-cochange=30
contextlayer.git.min-co-change-count=2
contextlayer.git.timeout-seconds=60

# --- Embeddings ---
# provider: "hash" (offline, zero setup, lexical) or "ollama" (real semantic model, local)
#contextlayer.embedding.provider=hash
#contextlayer.embedding.dimensions=384
contextlayer.embedding.batch-size=32
contextlayer.embedding.max-input-chars=4000
#contextlayer.embedding.query-prefix=
#contextlayer.embedding.document-prefix=
contextlayer.embedding.ollama-url=http://localhost:11434
contextlayer.embedding.ollama-model=nomic-embed-text
contextlayer.embedding.timeout-seconds=60
#
contextlayer.embedding.provider=ollama
contextlayer.embedding.dimensions=768
contextlayer.embedding.query-prefix=search_query:
contextlayer.embedding.document-prefix=search_document:

# --- Hybrid search ---
contextlayer.search.rrf-k=60
contextlayer.search.candidates-per-signal=40
contextlayer.search.keyword-weight=1.0
contextlayer.search.semantic-weight=1.0
contextlayer.search.summary-weight=0.6
contextlayer.search.name-weight=0.8

# --- Ranking ---
contextlayer.ranking.retrieval-weight=0.55
contextlayer.ranking.graph-weight=0.15
contextlayer.ranking.co-change-weight=0.10
contextlayer.ranking.recency-weight=0.08
contextlayer.ranking.working-weight=0.07
contextlayer.ranking.churn-weight=0.05
contextlayer.ranking.recency-half-life-days=30
contextlayer.ranking.seed-count=5
contextlayer.ranking.graph-depth=2
contextlayer.ranking.graph-decay=0.5
contextlayer.ranking.candidate-files=40

# --- Token budget ---
contextlayer.budget.default-tokens=6000
contextlayer.budget.min-tokens=500
contextlayer.budget.max-tokens=100000
contextlayer.budget.safety-margin-percent=10
contextlayer.budget.max-files=25
contextlayer.budget.max-chunks-per-file=3

# --- LLM (optional, local via Ollama) ---
contextlayer.llm.base-url=http://localhost:11434
contextlayer.llm.model=qwen2.5-coder:3b
contextlayer.llm.summary-model=qwen2.5-coder:3b
contextlayer.llm.max-output-tokens=1024
contextlayer.llm.max-answer-input-tokens=5000
contextlayer.llm.context-tokens=8192
contextlayer.llm.timeout-seconds=600
contextlayer.llm.max-summary-files-per-run=50
contextlayer.llm.keep-alive=2m

# which summary generator /refresh uses ("heuristic" is free and instant; "llm" is slow on CPU)
contextlayer.summary.default-generator=heuristic

server.port=8080
server.address=${SERVER_ADDRESS:127.0.0.1}