spring.application.name=contextlayer

# Load backend/.env if present (the working directory is backend/ when you run from IntelliJ or mvn)
spring.config.import=optional:file:.env[.properties]

# Database: env vars override defaults. DB_PASSWORD has NO default, so startup fails loudly if it's missing.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/contextlayer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=1234567890

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

server.port=8080

management.endpoints.web.exposure.include=health,info

logging.level.com.contextlayer=DEBUG

# --- Indexing ---
contextlayer.indexing.max-file-size-bytes=1048576
contextlayer.indexing.ignored-directories=.git,node_modules,target,build,dist,out,.idea,.vscode,.gradle,.mvn,__pycache__,.venv,venv,coverage,.next
contextlayer.indexing.ignored-extensions=png,jpg,jpeg,gif,webp,ico,svg,pdf,zip,jar,class,exe,dll,so,woff,woff2,ttf,mp3,mp4,lock,log
contextlayer.indexing.ignored-file-names=package-lock.json,pnpm-lock.yaml,yarn.lock,mvnw,mvnw.cmd,.DS_Store,Thumbs.db
contextlayer.indexing.chunk-max-lines=80
contextlayer.indexing.chunk-overlap-lines=10
contextlayer.indexing.chunk-max-chars=6000


