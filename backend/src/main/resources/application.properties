spring.application.name=contextlayer

# Load backend/.env if present (the working directory is backend/ when you run from IntelliJ or mvn)
spring.config.import=optional:file:.env[.properties]

# Database: env vars override defaults. DB_PASSWORD has NO default, so startup fails loudly if it's missing.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/contextlayer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

server.port=8080

management.endpoints.web.exposure.include=health,info

logging.level.com.contextlayer=DEBUG


