spring.application.name=contextlayer-test
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

contextlayer.indexing.max-file-size-bytes=1048576
contextlayer.indexing.ignored-directories=.git,node_modules,target
contextlayer.indexing.ignored-extensions=png,jpg
contextlayer.indexing.ignored-file-names=package-lock.json
contextlayer.indexing.chunk-max-lines=80
contextlayer.indexing.chunk-overlap-lines=10
contextlayer.indexing.chunk-max-chars=6000